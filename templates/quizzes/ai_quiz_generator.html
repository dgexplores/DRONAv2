{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Quiz Builder | SRMS DRONA" %}{% endblock %}

{% block content %}
<div class="page-title">{% trans "Quiz Builder" %}</div>
<p class="page-subtitle">
    {% trans "Upload an SOP PDF or paste text to generate MCQs automatically." %}
</p>

<div class="form-card">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
            <label for="module_id">{% trans "Select Module" %}</label>
            <select id="module_id" name="module_id" class="form-input" required>
                <option value="">-- {% trans "Select Module" %} --</option>
                {% for module in modules %}
                <option value="{{ module.id }}">{{ module.course.title }} → {{ module.title }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="pdf_file">{% trans "SOP PDF (Optional)" %}</label>
            <input type="file" id="pdf_file" name="pdf_file" class="form-input" accept=".pdf">
        </div>

        <div class="form-group">
            <label for="sop_text">{% trans "Or Paste SOP Text" %}</label>
            <textarea id="sop_text" name="sop_text" class="form-input"
                      placeholder="{% trans "Paste SOP content to generate questions..." %}"></textarea>
        </div>

        <div class="form-group">
            <label for="num_questions">{% trans "Number of Questions" %}</label>
            <select id="num_questions" name="num_questions" class="form-input">
                <option value="5">5</option>
                <option value="7">7</option>
                <option value="10">10</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block">⚡ {% trans "Generate Questions" %}</button>
    </form>
</div>
{% endblock %}
