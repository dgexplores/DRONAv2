{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="{{ UI_LANG }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1b3e">
    <title>{% trans "Bad Request | SRMS DRONA" %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="any">
</head>
<body>
    <div class="error-page">
        <div class="error-card">
            <div class="error-code">400</div>
            <div class="error-title">{% trans "Bad request" %}</div>
            <p class="error-message">{% trans "The request could not be processed. Please try again." %}</p>
            <a href="/" class="btn btn-primary">{% trans "Back to Dashboard" %}</a>
        </div>
    </div>
</body>
</html>
