{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | SRMS Drona</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-brand">
                <div class="logo-circle">S</div>
                <h1>Set a New Password</h1>
            </div>
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_new_password1">New Password</label>
                    <input type="password" id="id_new_password1" name="new_password1" class="form-input" required autofocus>
                    {% for error in form.new_password1.errors %}<span class="form-error">{{ error }}</span>{% endfor %}
                </div>
                <div class="form-group">
                    <label for="id_new_password2">Confirm Password</label>
                    <input type="password" id="id_new_password2" name="new_password2" class="form-input" required>
                    {% for error in form.new_password2.errors %}<span class="form-error">{{ error }}</span>{% endfor %}
                </div>
                <button type="submit" class="btn btn-primary btn-block mt-2">Change Password</button>
            </form>
            <div class="login-alt"><a href="{% url 'login' %}">Back to Sign In</a></div>
        </div>
    </div>
</body>
</html>
