{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="{{ UI_LANG }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Password Updated | SRMS DRONA" %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="any">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-brand">
                <div class="logo-circle">S</div>
                <h1>{% trans "Password Updated" %}</h1>
            </div>
            <div class="alert alert-success">{% trans "Your password has been changed. You can now sign in." %}</div>
            <div class="login-alt"><a href="{% url 'login' %}">{% trans "Go to Sign In" %}</a></div>
        </div>
    </div>
</body>
</html>
