name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    name: Backend tests (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check --settings=srms_dorna.test_settings

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=srms_dorna.test_settings

      - name: Run tests
        run: python manage.py test apps --settings=srms_dorna.test_settings -v 1

      - name: Collect static (build check)
        run: python manage.py collectstatic --noinput --settings=srms_dorna.test_settings

      - name: Python syntax gate (no pyc, fast fail)
        run: python -m compileall -q apps srms_dorna seed.py manage.py
