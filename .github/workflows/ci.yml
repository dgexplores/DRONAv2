name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    name: Backend tests (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check --settings=srms_drona.test_settings

      - name: Run tests
        run: python manage.py test apps --settings=srms_drona.test_settings

      - name: Collect static (build check)
        run: python manage.py collectstatic --noinput --settings=srms_drona.test_settings

  frontend-build:
    name: Landing page static build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - name: Validate static assets
        run: |
          test -f index.html && echo "index.html OK"
          test -f styles.css && echo "styles.css OK"
          test -f app.js && echo "app.js OK"
          test -f assets/logo-192.png && echo "icons OK"
