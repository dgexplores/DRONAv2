name: Deploy Frontend to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'

jobs:
  deploy:
    name: Deploy landing page to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_loQ2BLwxcIDji8O9knBGgm49
      VERCEL_PROJECT_ID: prj_4qKCruPUyApX2WwcWvEijQGhOX48
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel env (links project settings)
        working-directory: landing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build & Deploy to Vercel
        working-directory: landing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel --prod --yes --token=$VERCEL_TOKEN
