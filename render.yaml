# Render blueprint for DRONAv2 demo (free web + external Neon Postgres).
#
# ############################################################################
# # WARNING — THIS FILE DOES NOT CONTROL THE LIVE SERVICE.                   #
# #                                                                          #
# # The `dronav2` service was created MANUALLY in the Render dashboard and    #
# # is NOT Blueprint-managed. Editing this file changes NOTHING in            #
# # production. This already bit us: the `set -e` fix below sat inert while   #
# # prod kept running `A && B || true; C`, and only the live boot logs        #
# # revealed it (2026-09-14).                                                #
# #                                                                          #
# # Apply changes to the service too, then verify against the running one:    #
# #   render services update srv-dajkh37qj5pc73e038i0 --start-command '...'   #
# #   render deploys create srv-dajkh37qj5pc73e038i0 --confirm                #
# #   render logs -r srv-dajkh37qj5pc73e038i0 --limit 200 -o text             #
# #                                                                          #
# # Treat this file as documentation until the service is converted to        #
# # Blueprint management. See ENGINEERING.md trap 4.10.                       #
# ############################################################################
#
# Dashboard: New → Blueprint → select repo. Set DATABASE_URL to your Neon URL.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: dronav2
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # set -e aborts the boot on the first failed step. The previous
    # `A && B || true; gunicorn ...` form swallowed a failed migrate and started
    # gunicorn against a broken schema, which then reported healthy while every
    # query failed. set_admin_password is also wired in here (it was declared as
    # an env var but never invoked, so the rotation never happened on Render);
    # it exits 0 when DJANGO_ADMIN_PASSWORD is unset.
    startCommand: >-
      set -e;
      python manage.py migrate --noinput;
      python manage.py createcachetable rate_limit_cache;
      python manage.py set_admin_password;
      gunicorn srms_drona.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://dronav2.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: True
      # --- Set these in Dashboard → Environment (secrets) ---
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SRMS_BASE_URL
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
